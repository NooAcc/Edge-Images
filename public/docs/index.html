<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文档 - Edge Image</title>
    <meta
      name="description"
      content="Edge Image 媒体处理 API 文档，支持图片处理和视频封面提取。"
    />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .doc-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        margin-top: 24px;
      }

      .doc-card {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        padding: 28px;
        text-decoration: none;
        color: var(--ink);
        transition: all 0.2s;
      }

      .doc-card:hover {
        border-color: var(--accent);
        box-shadow: 0 4px 12px rgba(8, 127, 140, 0.12);
        transform: translateY(-2px);
      }

      .doc-card h3 {
        margin: 0 0 12px;
        font-size: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .doc-card p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }

      .doc-icon {
        font-size: 24px;
      }

      @media (max-width: 640px) {
        .doc-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="shell nav">
        <a class="brand" href="/">
          <span class="mark">I</span>
          <span>Edge Image</span>
        </a>
        <nav aria-label="页面导航">
          <a href="/">首页</a>
          <a href="/images.html">图片处理</a>
          <a href="/videos.html">视频处理</a>
          <a href="/batch.html">批量处理</a>
          <a href="/api.html">API</a>
        </nav>
      </div>
    </header>

    <main class="shell">
      <h1>文档中心</h1>
      <p class="lead">
        选择下方文档了解 Edge Image 的各项功能。
      </p>

      <div class="doc-grid">
        <a href="/images.html" class="doc-card">
          <h3><span class="doc-icon">📷</span>图片处理</h3>
          <p>支持缩放、裁剪、旋转、翻转，输出 WebP/JPEG/PNG/AVIF 格式，获取图片元信息。</p>
        </a>

        <a href="/videos.html" class="doc-card">
          <h3><span class="doc-icon">🎬</span>视频处理</h3>
          <p>自动提取 MP4/WebM 视频首帧作为封面图，获取视频元信息。</p>
        </a>

        <a href="/batch.html" class="doc-card">
          <h3><span class="doc-icon">📦</span>批量处理</h3>
          <p>一次请求处理多张图片或视频，最多 20 张/批次，全部完成后返回结果。</p>
        </a>

        <a href="/api.html" class="doc-card">
          <h3><span class="doc-icon">⚙️</span>API 参考</h3>
          <p>完整的 API 接口文档，包含请求参数、响应头和状态码说明。</p>
        </a>
      </div>
    </main>

    <footer>
      <div class="shell">Powered by Go, govips, and ffmpeg</div>
    </footer>
  </body>
</html>
